<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Kayunga District Youth Council</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
    <style>
        .welcome-message {
            background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            display: none;
        }
        .welcome-message.show {
            display: block;
            animation: slideDown 0.5s ease;
        }
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .welcome-message h2 {
            color: #1a1a2e;
            font-size: 1.25rem;
            margin-bottom: 10px;
        }
        .welcome-message p {
            color: #374151;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .features-list {
            text-align: left;
            margin-top: 15px;
            padding-left: 10px;
        }
        .features-list li {
            color: #374151;
            font-size: 0.85rem;
            margin-bottom: 6px;
            list-style: none;
            position: relative;
            padding-left: 20px;
        }
        .features-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #16a34a;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="images/logo.png" alt="Kayunga District">
                </a>
                <h1>Welcome Back</h1>
                <p>Sign in to your account</p>
            </div>
            
            <div class="welcome-message" id="welcomeMessage">
                <h2 id="welcomeTitle"></h2>
                <p id="welcomeText"></p>
                <ul class="features-list" id="featuresList"></ul>
            </div>
            
            <div id="message"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Sign In</button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create Account</a></p>
            </div>
            
            <div class="auth-back">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
        function togglePassword(fieldId) {
            const input = document.getElementById(fieldId);
            const btn = input.nextElementSibling;
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            const welcomeDiv = document.getElementById('welcomeMessage');
            welcomeDiv.classList.remove('show');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            
const formData = new URLSearchParams();
            formData.append('email', document.getElementById('email').value);
            formData.append('password', document.getElementById('password').value);
            
            try {
                const response = await fetch('backend/api/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('user_logged_in', 'true');
                    localStorage.setItem('user_email', data.user.email);
                    localStorage.setItem('user_first_name', data.user.first_name || '');
                    localStorage.setItem('user_id', data.user.id || '');
                    
                    messageDiv.innerHTML = '<div class="alert success">Login successful!</div>';
                    
                    document.getElementById('welcomeTitle').textContent = '👋 ' + data.welcome_message;
                    document.getElementById('welcomeText').textContent = 'Get ready to make a difference in Kayunga District!';
                    welcomeDiv.classList.add('show');
                    
                    setTimeout(() => {
                        window.location.href = data.redirect || 'user-dashboard.html';
                    }, 2000);
                } else {
                    messageDiv.innerHTML = '<div class="alert error">' + data.message + '</div>';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="alert error">An error occurred. Please try again.</div>';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
